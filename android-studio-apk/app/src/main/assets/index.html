    /* Hoạt ảnh kích thích học tập: Combo Streak, Cộng điểm XP bay lên, Nảy xanh khi Đúng, Rung nhẹ khi Sai */
    @keyframes comboPop {
      0% { transform: scale(0.75); opacity: 0; }
      55% { transform: scale(1.14); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .combo-pill-anim {
      animation: comboPop 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      box-shadow: 0 0 14px rgba(249, 115, 22, 0.45);
    }

    @keyframes correctSpring {
      0% { transform: scale(0.92); opacity: 0.4; }
      50% { transform: scale(1.035); }
      100% { transform: scale(1); opacity: 1; }
    }
    .anim-correct-pop {
      animation: correctSpring 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes gentleShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .anim-wrong-shake {
      animation: gentleShake 0.42s ease-in-out both;
    }

    @keyframes floatUpXp {
      0% { opacity: 0; transform: translateY(10px) scale(0.8); }
      25% { opacity: 1; transform: translateY(-4px) scale(1.06); }
      80% { opacity: 1; transform: translateY(-16px) scale(1); }
      100% { opacity: 0; transform: translateY(-26px) scale(0.95); }
    }
    .xp-float-badge {
      animation: floatUpXp 1.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      pointer-events: none;
    }

    @keyframes buddyWave {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      35% { transform: translateY(-3px) rotate(-6deg); }
      70% { transform: translateY(1px) rotate(6deg); }
    }
    .buddy-wave-anim {
      animation: buddyWave 2.1s ease-in-out infinite;
      display: inline-block;
    }

    @keyframes barShineSweep {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .progress-bar-animated {
      background: linear-gradient(90deg, #1E3F7F 0%, #2563EB 45%, #38BDF8 55%, #1E3F7F 100%);
      background-size: 200% 100%;
      animation: barShineSweep 2.4s linear infinite;
    }

    /* Hoạt ảnh chuyển cảnh & xuất hiện mượt mà */
    @keyframes fadeSlideUp {
      0% { opacity: 0; transform: translateY(14px) scale(0.985); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .anim-card { animation: fadeSlideUp 0.36s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .anim-delay-1 { animation-delay: 0.05s; }
    .anim-delay-2 { animation-delay: 0.10s; }
    .anim-delay-3 { animation-delay: 0.15s; }
    .anim-delay-4 { animation-delay: 0.20s; }

    /* Hoạt ảnh khi đổi giữa 50cc và Ô tô */
    @keyframes vehicleDriveAcross {
      0% { transform: translateX(-28px) scale(0.85); opacity: 0; }
      40% { transform: translateX(4px) scale(1.08); opacity: 1; }
      100% { transform: translateX(0) scale(1); opacity: 1; }
    }
    .vehicle-pop { animation: vehicleDriveAcross 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

    /* Hoạt ảnh ngọn lửa Streak */
    @keyframes flamePulse {
      0%, 100% { transform: scale(1) rotate(-2deg); filter: drop-shadow(0 0 6px rgba(249, 115, 22, 0.45)); }
      50% { transform: scale(1.16) rotate(3deg); filter: drop-shadow(0 0 12px rgba(239, 68, 68, 0.7)); }
    }
    .flame-anim { animation: flamePulse 1.6s ease-in-out infinite; display: inline-block; }

    /* Hoạt ảnh Tên lửa phóng & lửa phản lực ở màn hình Kết quả */
    @keyframes rocketHover {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-7px) rotate(-1.5deg); }
      75% { transform: translateY(4px) rotate(1.5deg); }
    }
    .rocket-launch { animation: rocketHover 2.4s ease-in-out infinite; }

    @keyframes thrusterGlow {
      0%, 100% { transform: scaleY(1) scaleX(1); opacity: 0.85; }
      50% { transform: scaleY(1.35) scaleX(1.15); opacity: 1; }
    }
    .thruster-flame { animation: thrusterGlow 0.32s ease-in-out infinite; transform-origin: top center; }

    @keyframes starTwinkle {
      0%, 100% { opacity: 0.25; transform: scale(0.75); }
      50% { opacity: 1; transform: scale(1.25); }

    .star-sparkle { animation: starTwinkle 1.8s ease-in-out infinite; }

    @keyframes confettiFall {
      0% { transform: translateY(-20px) rotate(0deg) rotateX(0deg); opacity: 1; }
      100% { transform: translateY(290px) rotate(360deg) rotateX(180deg); opacity: 0; }
    }
    .confetti-piece {
      position: absolute;
      top: 0;
      width: 8px;
      height: 14px;
      border-radius: 2px;
      pointer-events: none;
      animation: confettiFall 2.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
    }

    @keyframes shimmerBg {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .hero-shimmer {
      background-size: 200% 200%;
      animation: shimmerBg 6s ease infinite;
    }

    
    @keyframes shootingStar {
      0% { transform: translateX(0) translateY(0) rotate(-35deg); opacity: 0; }
      15% { opacity: 1; }
      70% { transform: translateX(-140px) translateY(90px) rotate(-35deg); opacity: 0; }
      100% { transform: translateX(-140px) translateY(90px) rotate(-35deg); opacity: 0; }

    .shooting-star {
      position: absolute;
      width: 36px;
      height: 2px;
      background: linear-gradient(90deg, rgba(255,255,255,0.95), transparent);
      border-radius: 999px;
      pointer-events: none;
      animation: shootingStar 3.2s ease-in-out infinite;
    }
    @keyframes sparkRise {
      0% { transform: translateY(0) scale(1); opacity: 0.9; }
      100% { transform: translateY(22px) scale(0.2); opacity: 0; }
    }
    .exhaust-spark {
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: #FDE047;
      animation: sparkRise 0.55s ease-out infinite;
    }

    
    @keyframes logoShine {
      0% { transform: translateX(-120%) skewX(-20deg); }
      35%, 100% { transform: translateX(220%) skewX(-20deg); }
    }
    .logo-shine-bar {
      animation: logoShine 4.2s ease-in-out infinite;
    }
    .pro-segmented-switch {
      position: relative;
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      width: 108px;
      height: 32px;
      padding: 2px;
      border-radius: 9999px;
      background: #E2E8F0;

      flex-shrink: 0;
      align-items: center;

    }
    .pro-switch-thumb {
      position: absolute;
      top: 2px;
      bottom: 2px;
      left: 2px;
      width: calc(50% - 2px);
      border-radius: 9999px;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.25s ease;
      box-shadow: 0 2px 6px rgba(29, 99, 237, 0.3);
      z-index: 1;
    }
    .pro-switch-btn {
      position: relative;
      z-index: 10;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 10.5px;
      font-weight: 800;
      border-radius: 9999px;
      transition: color 0.2s ease;
      cursor: pointer;
      white-space: nowrap;
      line-height: 1;
    }

    .double-ring-badge {
      width: 34px;
      height: 34px;
      border-radius: 9999px;
      display: flex;
      align-items: center;

    .double-ring-outer {
      width: 24px;

      border: 2.2px solid #FFFFFF;
      display: flex;

    }
    .double-ring-inner {
      width: 13px;
      height: 13px;
      border-radius: 9999px;
      border: 2.2px solid #FFFFFF;
    }
  </style>

    function decodeDatabase() {
      try {
        const binStr = atob(COMPRESSED_DB_B64);
        const bytes = new Uint8Array(binStr.length);
        for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
        if (window.pako && typeof window.pako.ungzip === 'function') {
          const jsonText = new TextDecoder('utf-8').decode(window.pako.ungzip(bytes));
          const raw = JSON.parse(jsonText);
          DB.mw = raw.mw.map(r => {
            const tMeta = TOPICS_META[r[2]] || TOPICS_META.s1_t1;
            let why = r[7];
            if (why === '@D') {
              why = `Đáp án ĐÚNG (○): Nhận định này hoàn toàn chính xác theo quy tắc an toàn của Luật Giao thông Đường bộ Nhật Bản (${tMeta.title}).`;
            } else if (why === '@S') {
              why = `Đáp án SAI (✕): Nhận định này sai quy định của Luật Giao thông Đường bộ Nhật Bản (${tMeta.title}). Hãy lưu ý kỹ giới hạn tốc độ, phạm vi cấm và các trường hợp ngoại lệ.`;
            }
            const img = (r[8] || '').replace('@M/', 'https://menkyo-web.com/');
            return [r[0], r[1], r[2], r[3], r[4], r[5], r[6], why, img, r[9] || '', r[10] || '', r[11] || null, r[12] || null, r[13] || null, r[14] || 'other_turn'];
          });
          DB.signs = raw.signs.map(s => {
            const img = (s[7] || '').replace('@W/', 'https://upload.wikimedia.org/wikipedia/commons/');
            return [s[0], s[1], s[2], s[3], s[4], s[5], s[6], img];
          });
        }
      } catch (e) {
        console.error('Decode error:', e);
      }
    }
    decodeDatabase();

        state.bookmarkedIds.splice(idx, 1);
      } else {
        state.bookmarkedIds.push(qId);
      }
      persistRealState();
    }

    function mapDbRowToQuestion(r) {
      const isSit = Array.isArray(r[11]) && r[11].length > 0;
      return {
        id: r[0],
        stage: r[1],
        topic_id: r[2],
        is_50cc: r[3],
        ans: r[4],
        text_vi: r[5],
        text_ja: r[6],
        explanation_vi: r[7],
        image_url: r[8],
        trap: r[9],
        tip: r[10] || '',
        isSituational: isSit,
        points: isSit ? 2 : 1,
        choices_vi: isSit ? r[11] : null,
        choices_answers: isSit ? r[12] : null,
        choices_explanations: isSit ? r[13] : null,
        sitCategory: isSit ? (r[14] || 'other_turn') : null
      };
    }

    function isQuestionFullyAnswered(q, userAns) {
      if (!q || userAns == null) return false;
      if (q.isSituational) {
        if (typeof userAns !== 'object') return false;
        const need = (q.choices_vi || []).length || 3;
        for (let i = 1; i <= need; i++) {
          if (userAns[i] !== 'D' && userAns[i] !== 'S') return false;
        }
        return true;
      }
      return userAns === 'D' || userAns === 'S';
    }

    function isQuestionAllCorrect(q, userAns) {
      if (!isQuestionFullyAnswered(q, userAns)) return false;
      if (q.isSituational) {
        const key = q.choices_answers || [];
        return key.every((ansCode, idx) => userAns[idx + 1] === ansCode);
      }
      return userAns === q.ans;
    }

    function getExamSetPoolAndSlice(setNumOrRandom) {
      const isCar = state.licenseTrack === 'car';
      let rawPool = [];
      let limitCount = 48;
      let maxPoints = 50;
      let passPoints = 45;
      let durationMin = 30;
      let examPrefix = 'moped_std';
      let baseName = 'Đề 50cc';

      if (isCar) {
        if (state.questionStage === 1) {
          rawPool = DB.mw.filter(r => r[1] === 1 && !Array.isArray(r[11]));
          limitCount = 50;
          maxPoints = 50;
          passPoints = 45;
          durationMin = 30;
          examPrefix = 'car_s1';
          baseName = 'Đề Karimen';
        } else {
          rawPool = DB.mw;
          limitCount = 95;
          maxPoints = 100;
          passPoints = 90;
          durationMin = 50;
          examPrefix = 'car_s2';
          baseName = 'Đề Honmen';
        }
      } else {
        rawPool = DB.mw.filter(r => r[3] === 1 || Array.isArray(r[11]));
        limitCount = 48;
        maxPoints = 50;
        passPoints = 45;
        durationMin = 30;
        examPrefix = state.questionStage === 1 ? 'moped_std' : 'moped_trap';
        baseName = state.questionStage === 1 ? 'Đề 50cc' : 'Đề Bẫy 50cc';
      }

      const mapped = rawPool.map(mapDbRowToQuestion);
      const tfPool = mapped.filter(q => !q.isSituational);
      // Toàn bộ 40 câu hỏi tình huống trong DB.mw đã được khử trùng lặp 100% (40 tình huống khác nhau hoàn toàn)
      const scPool = DB.mw.filter(r => Array.isArray(r[11]) && r[11].length > 0).map(mapDbRowToQuestion);
      const sitCount = examPrefix === 'car_s2' ? 5 : (examPrefix === 'car_s1' ? 0 : 2);
      const wordCount = limitCount - sitCount;

      if (setNumOrRandom === 'random') {
        const shuffle = (arr) => {
          const a = [...arr];
          for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
          }
          return a;
        };
        const unseenTf = tfPool.filter(q => !state.learnedIds.includes(q.id));
        const seenTf = tfPool.filter(q => state.learnedIds.includes(q.id));
        const chosenTf = [...shuffle(unseenTf), ...shuffle(seenTf)].slice(0, wordCount);
        const chosenSc = shuffle(scPool).slice(0, sitCount);
        return {
          title: `${baseName} · Đề Ngẫu Nhiên (${limitCount} câu · ${maxPoints}đ)`,
          badgeLabel: 'Đề Ngẫu Nhiên',
          key: examPrefix,
          setId: `${examPrefix}_random`,
          questions: [...chosenTf, ...chosenSc],
          limitCount,
          maxPoints,
          passPoints,
          durationMin,
          isRealExam: true
        };
      }

      const setNum = Math.max(1, Math.min(20, parseInt(setNumOrRandom, 10) || 1));
      let selected = [];

      {
        const baseOffset = (examPrefix === 'moped_trap') ? 150 : 0;
        const startIdx = (baseOffset + (setNum - 1) * wordCount) % Math.max(1, tfPool.length);
        const chosenTf = [];
        for (let i = 0; i < wordCount && i < tfPool.length; i++) {
          chosenTf.push(tfPool[(startIdx + i) % tfPool.length]);
        }
        const chosenSc = [];
        for (let i = 0; i < sitCount && scPool.length > 0; i++) {
          chosenSc.push(scPool[((setNum - 1) * sitCount + i) % scPool.length]);
        }
        selected = [...chosenTf, ...chosenSc];
      }

      return {
        title: `${baseName} · Đề số ${setNum} (${limitCount} câu · ${maxPoints}đ)`,
        badgeLabel: `Đề số ${setNum}`,
        key: examPrefix,
        setId: `${examPrefix}_${setNum}`,
        setNum,
        questions: selected,
        limitCount,
        maxPoints,
        passPoints,
        durationMin,
        isRealExam: true
      };
    }

    function computeExamCountdown(targetIso) {
      const today = new Date(2026, 10, 13);
      const parts = (targetIso || '2026-11-30').split('-').map(Number);
      const target = new Date(parts[0], parts[1] - 1, parts[2]);
      const diffDays = Math.max(0, Math.round((target.getTime() - today.getTime()) / 86400000));
      const label = `Ngày ${target.getDate()} tháng ${target.getMonth() + 1} năm ${target.getFullYear()}`;
      return { days: diffDays, label };
    }

      const historyCount = state.examHistory.length;

      const countdown = computeExamCountdown(state.examTargetIso);
      state.daysRemaining = countdown.days;

      const heroGrad = is50
        ? 'from-[#0284C7] via-[#1D63ED] to-[#2563EB]'
        : 'from-[#1D63ED] via-[#2563EB] to-[#4338CA]';

      const weekDays = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'].map(d => ({
        d,
        done: state.activeWeekDays.includes(d)
      }));

      const isDark = state.themeMode === 'dark';
      const latestExam = state.examHistory.length > 0 ? state.examHistory[0] : null;
      const targetParts = (state.examTargetIso || '2026-11-30').split('-');
      const shortDateVi = `${targetParts[2]}/${targetParts[1]}/${targetParts[0]}`;

      // Tính điểm năng lực & vị trí đường cong chuẩn từ dữ liệu làm bài THẬT
      const accuracyRatio = learnedCount > 0 ? (correctCount / learnedCount) : 0;
      const competencyScore = learnedCount > 0
        ? Math.min(100, Math.round(accuracyRatio * 100))
        : 0;
      const outrankPct = learnedCount > 0
        ? Math.min(99, Math.max(5, Math.round(competencyScore * 0.88)))
        : 0;
      // Tọa độ X trên đường cong (10..310)
      const pinX = Math.round(24 + (competencyScore / 100) * 272);
      const normDist = (pinX - 160) / 75;
      const pinY = Math.round(86 - 72 * Math.exp(-(normDist * normDist)));

      return `
        <div class="flex-1 bg-[#F4F5F8] px-3.5 pt-2.5 pb-16 overflow-y-auto no-scrollbar space-y-2.5">
          <!-- 1. Header 2 tầng chuẩn: Tầng 1 (Logo + Châm ngôn bên trái | 2 nút 🌙 & ⚙ bên phải — KHÔNG BAO GIỜ BỊ LÒI/TRÀN) + Tầng 2 (Thanh chuyển Hạng xe 100% chiều ngang) -->
          <div class="bg-white rounded-2xl p-3 border border-slate-200/85 shadow-2xs anim-card space-y-2.5">
            <div class="flex items-center justify-between gap-2">

                    <svg class="w-4 h-4 text-amber-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12 7a5 5 0 100 10 5 5 0 000-10zM2 13h2a1 1 0 100-2H2a1 1 0 100 2zm18 0h2a1 1 0 100-2h-2a1 1 0 100 2zM11 2v2a1 1 0 102 0V2a1 1 0 10-2 0zm0 18v2a1 1 0 102 0v-2a1 1 0 10-2 0zM5.99 4.58a1 1 0 00-1.41 1.41l1.06 1.06a1 1 0 001.41-1.41L5.99 4.58zm12.37 12.37a1 1 0 00-1.41 1.41l1.06 1.06a1 1 0 001.41-1.41l-1.06-1.06zm1.06-10.96a1 1 0 00-1.41-1.41l-1.06 1.06a1 1 0 001.41 1.41l1.06-1.06zM7.05 18.36a1 1 0 00-1.41-1.41l-1.06 1.06a1 1 0 001.41 1.41l1.06-1.06z"/></svg>
                  ` : `
                    <svg class="w-4 h-4 text-slate-700" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
                  `}
                </button>
                <button id="btnOpenSettingsGear" title="Cài đặt & Gói Pro" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-blue-50 border border-slate-200/80 flex items-center justify-center text-slate-700 hover:text-[#1D63ED] transition shrink-0">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"></path>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Thanh công tắc chuyển Hạng xe nằm gọn 100% bên trong thẻ Header -->
            ${renderCompactVehicleToggle(true)}
          </div>

          <!-- 2. Thẻ Đếm Ngược Ngày Thi -->
          <div class="anim-card anim-delay-1 relative overflow-hidden bg-gradient-to-r ${heroGrad} hero-shimmer rounded-[20px] px-3.5 py-3 text-white shadow-md shadow-blue-600/15">
            <div class="flex items-center justify-between text-[11px] font-bold text-white/90 mb-1.5">
              <span class="bg-white/20 px-2 py-0.5 rounded-full text-[10px] font-extrabold whitespace-nowrap">
                ${is50 ? '🛵 Đề chuẩn 50cc · 48 câu' : '🚗 Đề chuẩn Ô tô · 50/95 câu'}
              </span>
              <span class="whitespace-nowrap">Ngày thi: <strong>${shortDateVi}</strong></span>
            </div>

            <div class="flex items-center justify-between gap-2">
              <div class="flex items-baseline gap-1.5 whitespace-nowrap">
                <span class="text-[30px] font-black leading-none tracking-tight text-amber-300">${state.daysRemaining}</span>
                <span class="text-[13px] font-extrabold text-white">ngày còn lại</span>
              </div>
              <div class="flex items-center gap-1.5 shrink-0">
                <button id="btnChangeExamDate" class="px-2.5 py-1.5 bg-white/20 hover:bg-white/30 text-white border border-white/35 font-extrabold text-[11px] rounded-xl transition whitespace-nowrap">

                </button>
                <button id="btnQuickStartExam" class="px-3 py-1.5 bg-white hover:bg-blue-50 text-[#1D63ED] font-extrabold text-[11px] rounded-xl transition shadow-2xs whitespace-nowrap">

                </button>
              </div>
            </div>
          </div>

          <!-- 3. Thẻ Điểm bài thi gần nhất (Hiển thị dữ liệu thật từ state.examHistory) -->
          <div id="cardRecentQuizScore" class="anim-card anim-delay-1 bg-white rounded-[20px] px-3.5 py-3 border border-slate-200/80 shadow-2xs flex items-center justify-between cursor-pointer hover:border-indigo-400 transition">

                </svg>
              </div>
              <div class="min-w-0">
                ${latestExam ? `
                  <div class="flex items-center gap-2">

                      ${latestExam.passed ? 'ĐỖ (合格)' : 'TRƯỢT (不合格)'}
                    </span>
                  </div>
                  <div class="text-[11.5px] font-medium text-slate-500 truncate mt-0.5">${latestExam.title} (${latestExam.dateVi} ${latestExam.time})</div>
                ` : `
                  <div class="text-[14.5px] font-black text-slate-900 leading-tight">Chưa có bài thi nào</div>
                  <div class="text-[11.5px] font-medium text-slate-500 truncate mt-0.5">Nhấn vào đây để làm đề thi thử & lưu lịch sử thật</div>
                `}
              </div>
            </div>
            <span class="text-[11px] font-extrabold text-indigo-500 whitespace-nowrap ml-2">Lịch sử (${historyCount}) →</span>
          </div>

          <!-- 4. Thẻ Chuỗi ngày học (Cập nhật thật khi người dùng trả lời câu hỏi) -->
          <div id="cardDashStreak" class="anim-card anim-delay-2 bg-white rounded-[20px] px-3.5 py-3 border border-slate-200/80 shadow-2xs cursor-pointer hover:border-indigo-400 transition space-y-2.5">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2.5">
                <div class="relative w-8 h-8 flex items-center justify-center">
                  <span class="text-xl flame-anim select-none">🔥</span>
                  <span class="absolute -bottom-1 bg-indigo-600 text-white text-[9px] font-black px-1 rounded shadow-2xs">${state.streakDays}</span>
                </div>
                <span class="text-[15px] font-black text-slate-900">Chuỗi ngày học</span>
              </div>
              <span class="text-[11px] font-bold text-slate-500">
                ${state.streakDays > 0 ? `${state.streakDays} ngày học thực tế` : 'Làm 1 câu để bắt đầu chuỗi!'}
              </span>
            </div>

            <div class="grid grid-cols-7 gap-1 text-center">
              ${weekDays.map(w => `
                <div class="flex flex-col items-center gap-1">
                  <span class="text-[10.5px] ${w.done ? 'font-extrabold text-slate-900' : 'font-semibold text-slate-500'}">${w.d}</span>
                  <div class="w-7 h-7 rounded-full flex items-center justify-center ${
                    w.done
                      ? 'streak-done-circle bg-[#C7C3F4] text-slate-900 shadow-2xs'
                      : 'streak-todo-circle bg-slate-100 text-transparent border border-slate-200'
                  }">
                    ${w.done ? `
                      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 6L9 17l-5-5"/></svg>
                    ` : ''}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- 5. Lưới 2x2 Bento Stat Cards (100% số liệu thật từ quá trình làm bài của bạn) -->
          <div class="grid grid-cols-2 gap-2.5 anim-card anim-delay-3">
            <!-- Ô 1: Câu đã học thật -->
            <div id="cardDashLearned" class="bg-white rounded-[20px] p-3.5 border border-slate-200/80 shadow-2xs cursor-pointer hover:border-indigo-400 transition flex flex-col justify-between min-h-[84px]">
              <div class="flex items-center justify-between">
                <span class="text-[22px] font-black text-slate-900 leading-none">${learnedCount}</span>
                <div class="bento-icon-box w-7 h-7 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
                </div>
              </div>
              <div class="text-[11.5px] font-semibold text-slate-500 mt-1.5">Câu đã học (trên ${totalCards})</div>
            </div>

            <!-- Ô 2: Câu đánh dấu thật -->
            <div id="cardDashBookmarked" class="bg-white rounded-[20px] p-3.5 border border-slate-200/80 shadow-2xs cursor-pointer hover:border-indigo-400 transition flex flex-col justify-between min-h-[84px]">
              <div class="flex items-center justify-between">
                <span class="text-[22px] font-black text-slate-900 leading-none">${bookmarkedCount}</span>
                <div class="bento-icon-box w-7 h-7 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center">
                  <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </div>
              </div>
              <div class="text-[11.5px] font-semibold text-slate-500 mt-1.5">Câu đánh dấu ♥</div>
            </div>

            <!-- Ô 3: Đã ôn tập đúng thật -->
            <div id="cardDashTime" class="bg-white rounded-[20px] p-3.5 border border-slate-200/80 shadow-2xs cursor-pointer hover:border-indigo-400 transition flex flex-col justify-between min-h-[84px]">
              <div class="flex items-center justify-between">
                <span class="text-[22px] font-black text-slate-900 leading-none">${correctCount}</span>
                <div class="bento-icon-box w-7 h-7 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center">
                  <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
                </div>
              </div>
              <div class="text-[11.5px] font-semibold text-slate-500 mt-1.5">Câu trả lời đúng</div>
            </div>

            <!-- Ô 4: Lịch sử đề đã thi thật -->
            <div id="cardDashQuizzes" class="bg-white rounded-[20px] p-3.5 border border-slate-200/80 shadow-2xs cursor-pointer hover:border-indigo-400 transition flex flex-col justify-between min-h-[84px]">
              <div class="flex items-center justify-between">
                <span class="text-[22px] font-black text-slate-900 leading-none">${historyCount}</span>
                <div class="bento-icon-box w-7 h-7 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M22 10v6M2 10l10-5 10 5-10 5z"/><path stroke-linecap="round" stroke-linejoin="round" d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                </div>
              </div>
              <div class="text-[11.5px] font-semibold text-slate-500 mt-1.5">Đề thi đã hoàn thành</div>
            </div>
          </div>

          <!-- 6. Thẻ Biểu đồ Xếp hạng Năng lực (Bell Curve tính trực tiếp từ kết quả làm bài thật) -->
          <div class="anim-card anim-delay-4 bg-white rounded-[20px] p-3.5 border border-slate-200/80 shadow-2xs">
            <div class="flex items-baseline justify-between gap-2">
              <h3 class="text-[14.5px] font-black text-slate-900">
                ${learnedCount > 0 ? `Bạn vượt qua ${outrankPct}% người học` : 'Xếp hạng năng lực (Chưa có dữ liệu)'}
              </h3>
              <span class="text-[11px] font-extrabold text-indigo-500 whitespace-nowrap">Điểm: ${competencyScore}/100</span>
            </div>
            <div class="mt-2 relative pt-1">
              <svg viewBox="0 0 320 96" class="w-full h-20 overflow-visible">
                <defs>
                  <linearGradient id="bellGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#8B80F9" stop-opacity="0.35"/>
                    <stop offset="100%" stop-color="#8B80F9" stop-opacity="0.0"/>
                  </linearGradient>
                </defs>
                <path d="M 10 86 C 65 84, 105 12, 160 12 C 215 12, 255 84, 310 86 L 310 86 L 10 86 Z" fill="url(#bellGrad)" />
                <path d="M 10 86 C 65 84, 105 12, 160 12 C 215 12, 255 84, 310 86" fill="none" stroke="#818CF8" stroke-width="2.2" stroke-linecap="round"/>
                <line x1="160" y1="12" x2="160" y2="86" stroke="#64748B" stroke-opacity="0.4" stroke-width="1.2" stroke-dasharray="3 3" />
                <line x1="${pinX}" y1="${pinY}" x2="${pinX}" y2="86" stroke="#818CF8" stroke-width="1.8" />
                <circle cx="${pinX}" cy="${pinY}" r="5.5" fill="#1E1B4B" stroke="#818CF8" stroke-width="2.5" />
                <text x="${pinX}" y="${Math.max(14, pinY - 10)}" text-anchor="middle" class="bell-you-label text-[10px] font-black fill-slate-900">Bạn (${competencyScore}đ)</text>
              </svg>
              <div class="flex items-center justify-between text-[10.5px] font-semibold text-slate-500 px-2 -mt-1">
                <span>0</span>
                <span>Trung bình</span>
                <span>100</span>
              </div>
            </div>
          </div>


        </div>
      `;
    }

    // =========================================================================
    // 5. MÀN HÌNH NỘI DUNG HỌC TẬP (ĐÃ XOÁ NÚT ? NỔI BÊN NGOÀI)
    // =========================================================================
    function renderContentScreen() {
      const topicKeys = Object.keys(TOPICS_META);
      return `
        <div class="flex-1 bg-[#F8FAFC] px-5 pt-4 pb-16 overflow-y-auto no-scrollbar space-y-4">
          <div class="flex items-start justify-between gap-2 anim-card">
            <div>
              <h1 class="text-[24px] font-black text-slate-900 tracking-tight leading-tight">Nội dung học tập</h1>
              <p class="text-[12.5px] text-slate-500 font-medium mt-0.5">Hãy chọn chuyên đề bạn muốn luyện</p>
            </div>
            ${renderCompactVehicleToggle()}
          </div>

          ${topicKeys.map((tKey, idx) => {
            const meta = TOPICS_META[tKey];
            const st = state.topicStats[tKey];
            const pct = st ? st.pct : null;
            const artUri = UI_ART[meta.artKey] || UI_ART.card1;
            return `
              <div data-start-topic="${tKey}" class="topic-study-card anim-card relative overflow-hidden rounded-[18px] bg-gradient-to-r from-[#2172E8] via-[#2F80ED] to-[#4A94F7] p-5 min-h-[162px] flex flex-col justify-between text-white shadow-md cursor-pointer hover:brightness-105 transition">

                  <h2 class="text-[19px] font-extrabold leading-snug drop-shadow-2xs">${meta.title}</h2>
                  <p class="text-[12.5px] font-semibold text-white/90 mt-1">${meta.sections}</p>
                </div>
                <div class="relative z-10 flex items-center justify-between mt-8">
                  <span class="bg-white text-slate-900 text-[12px] font-extrabold px-4 py-2 rounded-full shadow-sm">
                    Bắt đầu học
                  </span>
                  ${pct != null ? `
                    <div class="w-11 h-11 rounded-full border-[3px] border-white bg-[#1D63ED]/40 backdrop-blur-xs flex items-center justify-center text-[11px] font-extrabold">
                      ${pct}%
                    </div>
                  ` : `
                    <span class="w-9 h-9 rounded-full flex items-center justify-center text-white text-lg font-bold">→</span>
                  `}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    // =========================================================================
    // 6. MÀN HÌNH BIỂN BÁO & VẠCH KẺ (152 BIỂN CHUẨN — GIỐNG HỆT ẢNH 2)
    // =========================================================================
    function renderSignsScreen() {
      const catMeta = SIGN_GROUPS_META.find(c => c.key === state.signCategory) || SIGN_GROUPS_META[0];
      const isDark = state.themeMode === 'dark';
      const q = state.signSearch.trim().toLowerCase();
      const filteredSigns = DB.signs.filter(s => {
        if (s[1] !== state.signCategory) return false;
        if (!q) return true;
        return (
          s[0].toLowerCase().includes(q) ||
          s[2].toLowerCase().includes(q) ||
          s[3].toLowerCase().includes(q) ||
          s[5].toLowerCase().includes(q)
        );
      });

      const containerBg = isDark ? '#0B0F17' : catMeta.bg;
      const headingColor = isDark ? 'text-slate-100' : 'text-[#2B2523]';
      const subTextColor = isDark ? 'text-slate-300' : 'text-[#1F1918]/85';
      const titleTextColor = isDark ? 'text-slate-100' : 'text-[#1F1918]';

      return `
        <div class="flex-1 flex flex-col transition-colors duration-300" style="background-color: ${containerBg};">
          <div class="px-4 pt-3 pb-2">
            <div class="flex items-center justify-between gap-2">
              <h1 class="text-[19px] font-extrabold ${headingColor}">Biển báo & Vạch kẻ</h1>
              <button id="btnPracticeSignQuestions" class="${isDark ? 'bg-[#1D63ED] text-white' : 'bg-[#2B2523] text-white'} text-[11px] font-bold px-3 py-1.5 rounded-full hover:opacity-90 transition whitespace-nowrap">
                Luyện câu hỏi biển báo →
              </button>
            </div>

            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar mt-2.5 pb-1">
              ${SIGN_GROUPS_META.map(c => {
                const active = c.key === state.signCategory;
                const btnCls = isDark
                  ? (active ? 'bg-[#1D63ED] text-white border-[#1D63ED]' : 'bg-slate-800/90 text-slate-300 border-slate-700 hover:bg-slate-700')
                  : (active ? 'bg-[#2B2523] text-white border-[#2B2523]' : 'bg-transparent text-[#2B2523] border-[#2B2523]/50 hover:bg-black/5');
                return `
                  <button data-sign-cat="${c.key}" class="sign-cat-btn shrink-0 px-3 py-1.5 rounded-full text-xs font-bold border transition whitespace-nowrap ${btnCls}">
                    ${c.label}
                  </button>
                `;
              }).join('')}
            </div>

            <div class="mt-2">

    // =========================================================================
    // 7. MÀN HÌNH CÂU HỎI LÝ THUYẾT (ĐỒNG BỘ SÁNG/TỐI RÕ NÉT 100%)
    // =========================================================================
    function renderQuestionsScreen() {
      const isCar = state.licenseTrack === 'car';
      const stg = state.questionStage; // 1 | 2
      const isDark = state.themeMode === 'dark';
      const bg = isDark
        ? (stg === 1 ? '#0B0F17' : '#111326')
        : (stg === 1 ? '#AAD9F7' : '#C4C1F8');
      const barColor = isDark
        ? (stg === 1 ? '#38BDF8' : '#818CF8')
        : (stg === 1 ? '#1E3F7F' : '#3B2885');
      const bannerUri = stg === 1 ? UI_ART.stage1 : UI_ART.stage2;

      let tab1Label, tab2Label, mockTitle, mockSub, mockKey, stageTopics;

      if (isCar) {
        tab1Label = 'Giai đoạn 1';
        tab2Label = 'Giai đoạn 2';
        if (stg === 1) {
          mockTitle = 'Luyện thi Karimen';
          mockSub = 'Tổng 50 câu · Hình thức thi thử';
          mockKey = 'car_s1';
          stageTopics = Object.entries(TOPICS_META).filter(([, m]) => m.stage === 1);
        } else {
          mockTitle = 'Luyện thi Honmen';
          mockSub = 'Tổng 95 câu · Hình thức thi thử';
          mockKey = 'car_s2';
          stageTopics = Object.entries(TOPICS_META).filter(([, m]) => m.stage === 2);
        }
      } else {
        tab1Label = 'Phần 1 · Cơ bản';
        tab2Label = 'Phần 2 · Thực chiến';
        if (stg === 1) {
          mockTitle = 'Luyện thi 50cc (Đề chuẩn)';
          mockSub = 'Tổng 48 câu · Hình thức thi thử';
          mockKey = 'moped_std';
          stageTopics = Object.entries(TOPICS_META).filter(([k]) => ['s1_t1', 's1_t2', 's1_t3', 's1_t6', 's1_t7', 's1_t8', 's1_t9', 's2_t2'].includes(k));
        } else {
          mockTitle = 'Luyện thi 50cc (Đề câu bẫy)';
          mockSub = 'Tổng 48 câu · Hình thức thi thử';
          mockKey = 'moped_trap';
          stageTopics = Object.entries(TOPICS_META).filter(([k]) => ['s1_t4', 's1_t5', 's1_t10', 's2_t1', 's2_t3', 's2_t4', 's2_t5', 's2_t7'].includes(k));
        }
      }

      const ms = state.mockStats[mockKey];

      return `
        <div class="flex-1 flex flex-col transition-colors duration-300" style="background-color: ${bg};">
          <!-- Hàng tiêu đề + Nút chuyển [🛵 50cc | 🚗 Ô tô] gọn đẹp căn thẳng hàng -->
          <div class="px-4 pt-3 pb-1.5 flex items-center justify-between gap-2">
            <h1 class="text-[19px] font-extrabold text-slate-900">Câu hỏi lý thuyết</h1>
            ${renderCompactVehicleToggle()}

          <!-- Thanh 2 Tab Giai đoạn 1 / Giai đoạn 2 -->
          <div class="grid grid-cols-2 border-b ${isDark ? 'border-slate-800' : 'border-slate-900/15'} mt-0.5">
            <button data-stage-tab="1" class="stage-tab-btn py-2.5 text-[13px] font-extrabold text-center border-b-[2.5px] transition ${
              stg === 1
                ? (isDark ? 'border-sky-400 text-sky-400' : 'border-slate-900 text-slate-900')
                : (isDark ? 'border-transparent text-slate-500' : 'border-transparent text-slate-900/50')
            }">
              ${tab1Label}
            </button>
            <button data-stage-tab="2" class="stage-tab-btn py-2.5 text-[13px] font-extrabold text-center border-b-[2.5px] transition ${
              stg === 2

                : (isDark ? 'border-transparent text-slate-500' : 'border-transparent text-slate-900/50')
            }">

            <div class="px-4 pt-3.5 space-y-2">

                  <span class="text-[11px] font-extrabold px-2.5 py-0.5 rounded-full whitespace-nowrap ${isDark ? 'bg-slate-800 text-sky-300 border border-slate-700' : 'bg-white/85 text-slate-800'}">
                    ${isCar ? '🚗 Ô tô' : '🛵 50cc'} · Lịch sử (${state.examHistory.length})
                  </span>
                </div>
                <div class="flex items-center justify-between mt-1">
                  <span class="text-[11.5px] font-semibold text-slate-700">${mockSub}</span>
                  <div class="flex items-center gap-2.5 text-xs font-bold text-slate-800 shrink-0">
                    <span>🏆 ${ms.trophies}</span>
                    <span>✏️ ${ms.attempts}</span>
                  </div>
                </div>
                <div class="w-full h-1.5 ${isDark ? 'bg-slate-800' : 'bg-white/80'} rounded-full overflow-hidden mt-2.5">
                  <div class="h-full rounded-full transition-all duration-500" style="width: ${Math.max(5, ms.pct)}%; background-color: ${barColor};"></div>
                </div>
                <div class="flex items-center justify-between text-[11px] font-bold text-slate-700 mt-1.5">

                  <span class="text-[#1D63ED] font-extrabold">Chọn Đề số 1–20 & Lịch sử →</span>
                </div>
              </div>

              <!-- Thanh chọn nhanh Số Đề Thi (Đề số 1 -> Đề số 20 + Đề Trộn Ngẫu Nhiên) -->

                <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
                  ${Array.from({ length: 20 }, (_, i) => {
                    const num = i + 1;
                    const setId = `${mockKey}_${num}`;
                    const doneInfo = state.completedExamSets[setId];
                    const isSel = Number(state.selectedExamSet) === num;
                    return `
                      <button data-pick-exam-set="${num}" class="quick-exam-set-btn shrink-0 px-3 py-1.5 rounded-xl text-[11px] font-extrabold border transition flex items-center gap-1 ${
                        isSel
                          ? 'bg-[#1D63ED] text-white border-[#1D63ED] shadow-xs scale-[1.03]'
                          : doneInfo
                          ? (doneInfo.passed ? 'bg-emerald-50 text-emerald-800 border-emerald-300' : 'bg-amber-50 text-amber-800 border-amber-300')

                      }">
                        <span>Đề ${num}</span>

                      </button>
                    `;
                  }).join('')}
                </div>
                <div class="mt-1.5 pt-2 border-t border-slate-200/70 space-y-1.5">
                  <button id="btnPracticeSituationalNow" class="w-full py-2 px-3 rounded-xl bg-gradient-to-r from-rose-500 to-orange-500 hover:opacity-95 text-white text-xs font-extrabold shadow-xs flex items-center justify-between transition">
                    <span class="flex items-center gap-1.5"><span>⚠️</span><span>Luyện Trọn Bộ 100 Câu Tình Huống (300 ý · 2đ/câu)</span></span>
                    <span>Thi ngay →</span>
                  </button>
                  <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
                    <button data-sit-cat-quiz="stop_park" class="sit-cat-quiz-btn shrink-0 px-2.5 py-1 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-800 border border-rose-200 text-[10.5px] font-extrabold transition">
                      🛑 Muốn dừng/đỗ xe &amp; Tấp lề (18 câu)
                    </button>
                    <button data-sit-cat-quiz="other_turn" class="sit-cat-quiz-btn shrink-0 px-2.5 py-1 rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200 text-[10.5px] font-extrabold transition">
                      🚲 Xe khác muốn rẽ trái/phải &amp; Đổi làn (32 câu)
                    </button>
                    <button data-sit-cat-quiz="self_turn" class="sit-cat-quiz-btn shrink-0 px-2.5 py-1 rounded-lg bg-blue-50 hover:bg-blue-100 text-[#1D63ED] border border-blue-200 text-[10.5px] font-extrabold transition">
                      ↩️ Bạn muốn rẽ trái/phải &amp; Quay đầu (20 câu)
                    </button>
                    <button data-sit-cat-quiz="ped_blind" class="sit-cat-quiz-btn shrink-0 px-2.5 py-1 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-200 text-[10.5px] font-extrabold transition">
                      🚶 Người đi bộ, Trẻ em &amp; Điểm mù (11 câu)
                    </button>
                    <button data-sit-cat-quiz="weather_road" class="sit-cat-quiz-btn shrink-0 px-2.5 py-1 rounded-lg bg-indigo-50 hover:bg-indigo-100 text-indigo-800 border border-indigo-200 text-[10.5px] font-extrabold transition">
                      🌧️ Đêm, Mưa, Tuyết, Đường sắt &amp; Đèo (19 câu)
                    </button>
                  </div>
                </div>
              </div>

              <!-- Danh sách Chuyên đề -->
              <div class="divide-y ${isDark ? 'divide-slate-800' : 'divide-slate-900/10'} pt-1">
                ${stageTopics.map(([tKey, meta], idx) => {
                  const qs = getQuestionsByTopic(tKey);
                  const st = state.topicStats[tKey];
                  const attempts = st ? st.attempts : 0;
                  const trophies = st ? st.trophies : 0;
                  const pct = st ? st.pct : 0;
                  const totalSets = Math.max(1, Math.ceil((qs.length || 15) / 15));
                  const curSetIdx = ((state.topicSetCursor[tKey] || 0) % totalSets) + 1;
                  const displayTotal = Math.min(15, qs.length || 15);
                  const correctNum = st ? st.lastCorrect : 0;
                  return `
                    <div data-topic-quiz="${tKey}" class="topic-row anim-card py-3.5 px-1.5 cursor-pointer ${isDark ? 'hover:bg-slate-800/50' : 'hover:bg-white/25'} rounded-xl transition">

                        <span class="text-[11px] font-bold text-slate-600">Chuyên đề ${idx + 1} · Kho ${qs.length} câu</span>

                      </div>
                      <div class="text-[15.5px] font-extrabold text-slate-900 mt-0.5">${meta.title}</div>
                      <div class="flex items-center justify-between mt-1">
                        <span class="text-[11.5px] font-semibold text-slate-700">${displayTotal} câu / lượt (Đổi câu mới mỗi lần làm)</span>

                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 8. MÀN HÌNH LÀM BÀI THI TƯƠNG TÁC (QUIZ RUNNER + NÚT ? BÁO ĐỀ SAI)
    // =========================================================================
    function renderQuizScreen() {
      const qs = state.quizQuestions;
      const q = qs[state.quizIndex];
      if (!q) {
        state.screen = 'questions';
        return renderQuestionsScreen();
      }
      const userAns = state.quizAnswers[state.quizIndex];
      const isAnswered = isQuestionFullyAnswered(q, userAns);
      const isCorrect = isQuestionAllCorrect(q, userAns);
      const answeredTotal = qs.filter((item, idx) => isQuestionFullyAnswered(item, state.quizAnswers[idx])).length;
      const pct = Math.round(((state.quizIndex + 1) / qs.length) * 100);
      const isRewardUnlocked = state.isPro || state.rewardedUnlockedUntil > Date.now();
      const setLabel = state.selectedExamSet === 'random' ? 'Đề Ngẫu Nhiên' : `Đề số ${state.selectedExamSet || 1}`;
      const showFeedbackNow = (!state.isRealExamMode || state.instantFeedbackInExam) && isAnswered;
      const maxPts = qs.reduce((s, item) => s + (item.points || 1), 0);
      const passPts = maxPts === 100 ? 90 : (maxPts === 50 ? 45 : Math.ceil(maxPts * 0.9));

      return `
        <div class="h-full flex-1 min-h-0 flex flex-col bg-[#AAD9F7] overflow-hidden">

            <div class="text-center flex-1 min-w-0 px-0.5">
              <div class="text-[11.5px] font-extrabold text-slate-900 truncate">${state.activeQuizTitle}</div>
              <div class="flex items-center justify-center gap-1.5 mt-0.5">
                ${state.isRealExamMode ? `
                  <span id="liveExamTimerBadge" class="px-2 py-0.5 rounded-full text-[10.5px] font-black bg-slate-900 text-white shrink-0">
                    ⏱️ ${formatCountdownTimer(state.examSecondsLeft)}
                  </span>
                ` : ''}
                <span class="text-[10px] font-extrabold text-slate-800 truncate">
                  Đã làm ${answeredTotal}/${qs.length} · Đỗ ≥ ${passPts}/${maxPts}đ
                </span>
              </div>
            </div>
            <button id="btnOpenOmrSheet" title="Mở Bảng Phiếu Trả Lời OMR" class="px-2.5 py-1.5 rounded-full bg-white/90 hover:bg-white text-slate-900 border border-slate-300 text-[10.5px] font-extrabold flex items-center gap-1 shadow-2xs transition shrink-0">
              <span>📋</span>
              <span>Phiếu (${answeredTotal}/${qs.length})</span>
            </button>
            <button id="btnToggleBookmarkQuiz" title="Đánh dấu câu hỏi này" class="w-7 h-7 rounded-full bg-white/85 hover:bg-white ${state.bookmarkedIds.includes(q.id) ? 'text-rose-600 border-rose-300' : 'text-slate-500 border-slate-300'} border font-black text-xs flex items-center justify-center shadow-2xs transition shrink-0">
              ${state.bookmarkedIds.includes(q.id) ? '♥' : '♡'}
            </button>
            <button id="btnFinishQuizNow" class="bg-[#1E3F7F] text-white text-[11px] font-extrabold px-3 py-1.5 rounded-full hover:opacity-90 transition shrink-0 shadow-xs">
              Nộp bài
            </button>
          </div>

          <div class="px-4 pb-1.5 shrink-0">
            <div class="w-full h-1.5 bg-white/70 rounded-full overflow-hidden">
              <div class="h-full progress-bar-animated rounded-full transition-all duration-500" style="width: ${pct}%;"></div>
            </div>
          </div>

          <!-- Thân bài thi: vùng câu hỏi cuộn độc lập ở giữa, cụm nút điều khiển ghim cố định dưới đáy -->
          <div class="flex-1 min-h-0 bg-[#F8FAFC] rounded-t-[26px] flex flex-col overflow-hidden">
            <div class="flex-1 min-h-0 overflow-y-auto no-scrollbar px-4 pt-3 pb-2 space-y-2.5 anim-card">

                <div class="flex items-center gap-1.5 flex-wrap">

                  </span>
                  ${qs.some(x => x.isSituational) && !q.isSituational ? `
                    <button id="btnJumpToSituational" class="text-[10px] font-extrabold bg-amber-100 hover:bg-amber-200 text-amber-900 px-2 py-1 rounded-full transition">
                      ⚠️ Tới câu Tình huống 2đ →
                    </button>
                  ` : ''}
                </div>
                <div class="flex items-center gap-1.5">
                  ${state.isRealExamMode ? `
                    <button id="btnToggleExamFeedbackMode" class="text-[10px] font-extrabold px-2 py-1 rounded-full border transition ${

                  <button id="btnReportInlineChip" class="text-[10.5px] font-bold text-slate-500 hover:text-rose-600 flex items-center gap-1 transition">

                </div>

              <p class="text-[15px] font-extrabold text-slate-900 leading-relaxed">
                ${q.text_vi}

              ${q.text_ja ? `
                <details class="bg-slate-100/80 border border-slate-200 rounded-xl px-3 py-2 text-xs">

              ${q.isSituational ? `
                <!-- GIAO DIỆN CÂU HỎI TÌNH HUỐNG 3 Ý (1)-(2)-(3) CHUẨN 100% THI THẬT NHẬT BẢN -->
                <div class="bg-amber-50/90 border border-amber-300 rounded-xl px-3 py-2 text-[11.5px] font-bold text-amber-950 flex items-center justify-between gap-2">

                  <span class="shrink-0 px-2 py-0.5 rounded-full text-[10.5px] font-black ${

      if (!days) return { iso: null, label: 'Vĩnh viễn (Trọn đời)' };
      const d = new Date(2026, 10, 13);
      d.setDate(d.getDate() + days);
      const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      const label = `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
      return { iso, label };
    }

    function startQuizSession(title, key, questionsList, limitCount, setId = null, isRealExam = false, durationMin = 30) {
      let list = [...questionsList];
      if (limitCount && list.length > limitCount) {
        list = list.slice(0, limitCount);
      }
      state.activeQuizTitle = title;
      state.activeQuizKey = key;
      state.activeSetId = setId;
      state.quizQuestions = list;
      state.quizIndex = 0;
      state.quizAnswers = {};
      state.currentCombo = 0;
      state.isRealExamMode = Boolean(isRealExam);
      state.instantFeedbackInExam = false;
      if (state.isRealExamMode) {
        startExamCountdownTimer(durationMin || (list.length >= 90 ? 50 : 30));
      } else if (window._examCountdownInterval) {
        clearInterval(window._examCountdownInterval);
      }
      state.screen = 'quiz';
      render();
      if (state.isRealExamMode) {
        showFriendlyToast('🎯', `Bắt đầu ${title} · Chế độ Thi thật 100% (${durationMin} phút · Nộp bài mới chấm điểm)!`);
      } else {
        showFriendlyToast('💪', `Bắt đầu ${title}! Cứ bình tĩnh làm bài nhé, mình luôn cổ vũ bạn!`);
      }
    }

    function finishQuizSession() {
      if (window._examCountdownInterval) {
        clearInterval(window._examCountdownInterval);
      }
      const qs = state.quizQuestions;
      let correctCount = 0;
      let earnedPoints = 0;
      let maxPoints = 0;
      let tfCorrect = 0;
      let tfTotal = 0;
      let sitCorrect = 0;
      let sitTotal = 0;

      const items = qs.map((q, idx) => {
        const u = state.quizAnswers[idx] || null;
        const pts = q.points || (q.isSituational ? 2 : 1);
        maxPoints += pts;
        const ok = isQuestionAllCorrect(q, u);
        if (isQuestionFullyAnswered(q, u)) {
          recordQuestionAttempt(q.id, ok);
        }
        if (q.isSituational) {
          sitTotal += 1;
          if (ok) sitCorrect += 1;
        } else {
          tfTotal += 1;
          if (ok) tfCorrect += 1;
        }
        if (ok) {
          correctCount += 1;
          earnedPoints += pts;
        }
        return {
          id: q.id,
          num: idx + 1,
          isCorrect: ok,
          isSituational: Boolean(q.isSituational),
          points: pts,
          earnedPoints: ok ? pts : 0,
          text_vi: q.text_vi,
          text_ja: q.text_ja || '',
          explanation_vi: q.explanation_vi || '',
          image_url: q.image_url || '',
          ans: q.ans,
          choices_vi: q.choices_vi || null,
          choices_answers: q.choices_answers || null,
          choices_explanations: q.choices_explanations || null,
          user: u
        };
      });

      const passPoints = maxPoints === 100 ? 90 : (maxPoints === 50 ? 45 : Math.ceil(maxPoints * 0.9));
      const pct = maxPoints > 0 ? Math.round((earnedPoints / maxPoints) * 100) : 0;
      const passed = earnedPoints >= passPoints;

      state.lastResult = {
        title: state.activeQuizTitle,
        correctCount,
        totalCount: qs.length,
        earnedPoints,
        maxPoints,
        passPoints,
        tfCorrect,
        tfTotal,
        sitCorrect,
        sitTotal,
        items
      };

      if (state.activeSetId) {
        state.completedExamSets[state.activeSetId] = {
          score: earnedPoints,
          total: maxPoints,
          passed: passed,
          pct: pct
        };
      }
      if (state.mockStats[state.activeQuizKey]) {
        const ms = state.mockStats[state.activeQuizKey];
        ms.attempts += 1;
        if (passed) ms.trophies += 1;
        ms.lastScore = `${earnedPoints}/${maxPoints}đ`;
        ms.pct = pct;
      } else {
        const cur = state.topicStats[state.activeQuizKey] || { attempts: 0, trophies: 0 };
        state.topicStats[state.activeQuizKey] = {
          attempts: cur.attempts + 1,
          trophies: cur.trophies + (passed ? 1 : 0),
          lastCorrect: correctCount,
          lastTotal: qs.length,
          pct
        };
      }
      const nowDt = new Date();
      const hh = String(nowDt.getHours()).padStart(2, '0');
      const mm = String(nowDt.getMinutes()).padStart(2, '0');
      state.examHistory.unshift({
        date: '2026年11月16日',
        dateVi: '16/11/2026',
        time: `${hh}:${mm}`,
        score: earnedPoints,
        maxScore: maxPoints,
        passed: passed,
        title: state.activeQuizTitle,
        items: items
      });
      markTodayActivity();
      persistRealState();
      state.screen = 'result';
      render();
    }

      const ALPHABET_32 = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';

      function computeLicenseSignature(prefix, yyyymmdd, nonce4) {
        const payload = `OTD|${prefix}|${yyyymmdd}|${nonce4}|${LICENSE_SIGNING_SALT}`;
        let h1 = 0x811c9dc5;
        let h2 = 0xcbf29ce4;
        for (let i = 0; i < payload.length; i++) {
          const ch = payload.charCodeAt(i);
          h1 ^= ch;
          h1 = Math.imul(h1, 0x01000193) >>> 0;
          h2 ^= (ch + i * 31) & 0xff;
          h2 = Math.imul(h2, 0x01000193) >>> 0;
        }
        let out = '';
        let v1 = h1;
        let v2 = h2;
        for (let i = 0; i < 6; i++) {
          const idx = ((i % 2 === 0 ? v1 : v2) & 0x1f) >>> 0;
          out += ALPHABET_32[idx];
          v1 = (v1 >>> 5) ^ (v2 << 3);
          v2 = (v2 >>> 5) ^ (v1 << 2);
        }
        return out;
      }

      function verifySignedLicenseKeyWeb(rawInput) {
        const cleaned = (rawInput || '').trim().toUpperCase();
        if (!cleaned) {
          return { ok: false, message: 'Vui lòng nhập mã giao dịch hợp lệ. Không thể khôi phục hoặc kích hoạt khi để trống mã.' };

        const m = /^OTD-(30D|90D|VIP)-(\d{8})-([A-Z0-9]{4})-([A-Z0-9]{6})$/.exec(cleaned);

            ok: false,

          };
        }
        const [, prefix, yyyymmdd, nonce4, sig] = m;
        const expected = computeLicenseSignature(prefix, yyyymmdd, nonce4);
        if (sig !== expected) {
          return {
            ok: false,
            message: 'Chữ ký số xác thực trên mã giao dịch không hợp lệ! Không thể mở khóa gói Pro.'

      const btnStartMock = document.getElementById('btnStartMockExam');
      if (btnStartMock) {
        btnStartMock.onclick = () => {
          state.screen = 'history';
          render();
        };
      }

      const btnCloseHist = document.getElementById('btnCloseHistoryScreen');
      if (btnCloseHist) {
        btnCloseHist.onclick = () => {
          state.screen = 'questions';
          render();
        };
      }

      const btnLaunchBrief = document.getElementById('btnLaunchExamFromBrief');
      if (btnLaunchBrief) {
        btnLaunchBrief.onclick = () => launchMockExamSession();
      }

      document.querySelectorAll('.history-row').forEach(row => {
        row.onclick = () => {
          const hIdx = parseInt(row.getAttribute('data-history-idx'), 10);
          const hItem = state.examHistory[hIdx];
          if (hItem && Array.isArray(hItem.items)) {
            state.lastResult = {
              title: hItem.title,
              correctCount: hItem.score,
              totalCount: hItem.maxScore,
              earnedPoints: hItem.score,
              maxPoints: hItem.maxScore,
              passPoints: hItem.maxScore === 100 ? 90 : 45,
              tfCorrect: hItem.items.filter(x => !x.isSituational && x.isCorrect).length,
              tfTotal: hItem.items.filter(x => !x.isSituational).length,
              sitCorrect: hItem.items.filter(x => x.isSituational && x.isCorrect).length,
              sitTotal: hItem.items.filter(x => x.isSituational).length,
              items: hItem.items
            };
          }
          state.screen = 'result';
          render();
        };
      });

      document.querySelectorAll('.bank-bm-btn').forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          toggleBookmarkQuestion(btn.getAttribute('data-bookmark-id'));
          render();
        };
      });

      const btnFilterBm = document.getElementById('btnToggleBankBookmarkedOnly');
      if (btnFilterBm) {
        btnFilterBm.onclick = () => {
          state.bankOnlyBookmarked = !state.bankOnlyBookmarked;
          state.bankPage = 1;
          render();
        };
      }

      document.querySelectorAll('.topic-row').forEach(row => {
        row.onclick = () => {
          const tKey = row.getAttribute('data-topic-quiz');
          const meta = TOPICS_META[tKey];
          const qs = getQuestionsByTopic(tKey);
          const totalSets = Math.max(1, Math.ceil(qs.length / 15));
          const curIdx = (state.topicSetCursor[tKey] || 0) % totalSets;
          state.topicSetCursor[tKey] = (curIdx + 1) % totalSets;
          persistRealState();
          const slice = qs.slice(curIdx * 15, curIdx * 15 + 15);
          startQuizSession(`${meta.title} · Bộ #${curIdx + 1}`, tKey, slice.length > 0 ? slice : qs, 15);
        };
      });

      document.querySelectorAll('.quiz-ans-btn').forEach(btn => {
        btn.onclick = () => {
          const picked = btn.getAttribute('data-pick-ans');
          const prevAns = state.quizAnswers[state.quizIndex];
          state.quizAnswers[state.quizIndex] = picked;
          const curQ = state.quizQuestions[state.quizIndex];
          if (curQ && (!state.isRealExamMode || state.instantFeedbackInExam)) {
            const isOk = picked === curQ.ans;
            if (prevAns !== picked) {
              if (isOk) {
                state.currentCombo = (state.currentCombo || 0) + 1;
                if (state.currentCombo > (state.maxCombo || 0)) state.maxCombo = state.currentCombo;
                state.xpPoints = (state.xpPoints || 0) + 10 + Math.min(20, state.currentCombo * 2);
                if (state.currentCombo === 3 || state.currentCombo === 5 || state.currentCombo === 10) {
                  showFriendlyToast('🔥', `Quá đỉnh bạn ơi! Chuỗi ${state.currentCombo} câu đúng liên tiếp! (+${10 + state.currentCombo * 2} XP)`);
                }
              } else {
                state.currentCombo = 0;
              }
            }
            recordQuestionAttempt(curQ.id, isOk);
          }
          render();
          // Trong chế độ Thi thật 100% (ẩn đáp án), tự động chuyển nhẹ sang câu tiếp theo sau khi chọn
          if (state.isRealExamMode && !state.instantFeedbackInExam && prevAns == null && state.quizIndex + 1 < state.quizQuestions.length) {
            clearTimeout(window._autoNextExamTimer);
            window._autoNextExamTimer = setTimeout(() => {
              if (state.screen === 'quiz' && state.quizIndex + 1 < state.quizQuestions.length) {
                state.quizIndex++;
                render();
              }
            }, 220);
          }
        };
      });

      document.querySelectorAll('.sit-ans-btn').forEach(btn => {
        btn.onclick = () => {
          const itemNum = parseInt(btn.getAttribute('data-sit-item'), 10);
          const picked = btn.getAttribute('data-sit-pick');
          const curObj = (state.quizAnswers[state.quizIndex] && typeof state.quizAnswers[state.quizIndex] === 'object')
            ? { ...state.quizAnswers[state.quizIndex] }
            : {};
          curObj[itemNum] = picked;
          state.quizAnswers[state.quizIndex] = curObj;
          const curQ = state.quizQuestions[state.quizIndex];
          if (curQ && isQuestionFullyAnswered(curQ, curObj) && (!state.isRealExamMode || state.instantFeedbackInExam)) {
            const isOk = isQuestionAllCorrect(curQ, curObj);
            if (isOk) {
              state.currentCombo = (state.currentCombo || 0) + 1;
              state.xpPoints = (state.xpPoints || 0) + 25;
              showFriendlyToast('🎉', 'Xuất sắc! Bạn đúng cả 3/3 ý câu tình huống (+2 điểm)!');
            } else {
              state.currentCombo = 0;
            }
            recordQuestionAttempt(curQ.id, isOk);
          }
          render();
        };
      });

      const btnBmQuiz = document.getElementById('btnToggleBookmarkQuiz');
      if (btnBmQuiz) {
        btnBmQuiz.onclick = () => {
          const curQ = state.quizQuestions[state.quizIndex];
          if (curQ) {
            toggleBookmarkQuestion(curQ.id);
            render();
          }
        };
      }

      const btnUnlockTrap = document.getElementById('btnUnlockTrapQuiz');
      if (btnUnlockTrap) {
        btnUnlockTrap.onclick = () => showRewardedVideoAdModal();
      }

      const btnPrevQ = document.getElementById('btnPrevQuizQ');
      if (btnPrevQ) btnPrevQ.onclick = () => { if (state.quizIndex > 0) { state.quizIndex--; render(); } };

      const btnNextQ = document.getElementById('btnNextQuizQ');
      if (btnNextQ) {
        btnNextQ.onclick = () => {
          if (state.quizIndex + 1 < state.quizQuestions.length) {
            state.quizIndex++;
            render();
          } else {
            finishQuizSession();
          }
        };
      }

      const btnExitQuiz = document.getElementById('btnExitQuiz');
      if (btnExitQuiz) btnExitQuiz.onclick = () => { state.screen = 'questions'; render(); };
      const btnFinishNow = document.getElementById('btnFinishQuizNow');
      if (btnFinishNow) btnFinishNow.onclick = () => finishQuizSession();

      const btnCloseRes = document.getElementById('btnCloseResult');
      if (btnCloseRes) btnCloseRes.onclick = () => { state.screen = 'questions'; render(); };
      const btnRetry = document.getElementById('btnRetrySameQuiz');
      if (btnRetry) {
        btnRetry.onclick = () => {
          if (state.quizQuestions.length > 0) {
            state.quizIndex = 0;
            state.quizAnswers = {};
            state.currentCombo = 0;
            state.screen = 'quiz';
            render();
            showFriendlyToast('↺', 'Mình cùng làm lại đề này để nắm chắc 100% các câu vừa nhầm nhé!');
          } else {
            launchMockExamSession(state.selectedExamSet);
          }
        };
      }
      const btnNextSet = document.getElementById('btnNextExamSet');
      if (btnNextSet) {
        btnNextSet.onclick = () => {
          const nextNum = typeof state.selectedExamSet === 'number' ? ((state.selectedExamSet % 20) + 1) : 2;
          state.selectedExamSet = nextNum;
          persistRealState();
          launchMockExamSession(nextNum);
        };
      }

      const inputBank = document.getElementById('inputBankSearch');
      if (inputBank) {
        inputBank.oninput = (e) => {
          state.bankSearch = e.target.value;
          state.bankPage = 1;
          const pos = e.target.selectionStart;
          render();
          const ni = document.getElementById('inputBankSearch');
          if (ni) { ni.focus(); ni.setSelectionRange(pos, pos); }
        };
      }
      document.querySelectorAll('.bank-stg-btn').forEach(btn => {
        btn.onclick = () => {
          state.bankStageFilter = btn.getAttribute('data-bank-stg');
          state.bankTopic = 'all';
          state.bankPage = 1;
          render();
        };
      });

      document.querySelectorAll('.bank-topic-chip').forEach(chip => {
        chip.onclick = () => {
          state.bankTopic = chip.getAttribute('data-bank-topic-chip');
          state.bankPage = 1;
          render();
        };
      });

      const btnTopicGrid = document.getElementById('btnOpenTopicGridModal');
      if (btnTopicGrid) {
        btnTopicGrid.onclick = () => {
          openModal(`
            <div class="space-y-3">
              <div class="flex items-center justify-between border-b border-slate-100 pb-2">
                <h3 class="text-base font-black text-slate-900">Chọn chuyên đề sát hạch</h3>
                <button id="btnModalClose" class="text-xs font-bold text-slate-500">Đóng ✕</button>
              </div>
              <div class="space-y-1.5 max-h-[60vh] overflow-y-auto no-scrollbar pr-0.5">
                <button data-pick-modal-topic="all" class="modal-topic-item w-full text-left px-3 py-2.5 rounded-xl border text-xs font-extrabold flex items-center justify-between transition ${
                  state.bankTopic === 'all' ? 'bg-blue-50 border-[#1D63ED] text-[#1D63ED]' : 'bg-slate-50 border-slate-200 text-slate-800'
                }">
                  <span>Tất cả 18 chuyên đề (${DB.mw.length} câu)</span>
                  <span>${state.bankTopic === 'all' ? '✓' : ''}</span>
                </button>
                ${Object.entries(TOPICS_META).map(([k, m]) => {
                  const active = state.bankTopic === k;
                  return `
                    <button data-pick-modal-topic="${k}" class="modal-topic-item w-full text-left px-3 py-2.5 rounded-xl border text-xs font-bold flex items-center justify-between transition ${
                      active ? 'bg-blue-50 border-[#1D63ED] text-[#1D63ED]' : 'bg-white border-slate-200 text-slate-800 hover:bg-slate-50'
                    }">
                      <div class="truncate pr-2">
                        <span class="inline-block px-1.5 py-0.5 rounded text-[10px] font-black mr-1 ${m.stage === 1 ? 'bg-sky-100 text-sky-800' : 'bg-indigo-100 text-indigo-800'}">GĐ${m.stage}</span>
                        <span>${m.title}</span>
                      </div>
                      <span class="font-black">${active ? '✓' : '→'}</span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          `);
          document.querySelectorAll('.modal-topic-item').forEach(item => {
            item.onclick = () => {
              state.bankTopic = item.getAttribute('data-pick-modal-topic');
              state.bankPage = 1;
              document.getElementById('appModal').classList.add('hidden');
              render();
            };
          });
        };
      }
      const btnBankPrev = document.getElementById('btnBankPrev');
      if (btnBankPrev) btnBankPrev.onclick = () => { if (state.bankPage > 1) { state.bankPage--; render(); } };
      const btnBankNext = document.getElementById('btnBankNext');
      if (btnBankNext) btnBankNext.onclick = () => { state.bankPage++; render(); };
      const btnPracBank = document.getElementById('btnPracticeFilteredBank');
      if (btnPracBank) {
        btnPracBank.onclick = () => {
          const q = state.bankSearch.trim().toLowerCase();
          const filtered = DB.mw.filter(r => {
            if (state.bankTopic !== 'all' && r[2] !== state.bankTopic) return false;
            if (!q) return true;
            return r[0].toLowerCase().includes(q) || r[5].toLowerCase().includes(q) || r[6].toLowerCase().includes(q);
          }).map(mapDbRowToQuestion);
          if (filtered.length > 0) {
            startQuizSession('Luyện câu hỏi theo bộ lọc', 'bank_custom', filtered, 50);
          }
        };
      }
    }

    document.querySelectorAll('.top-nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.screen = btn.getAttribute('data-goto');
        render();
      });
    });


    document.querySelectorAll('.bottom-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        state.screen = tab.getAttribute('data-tab');
        render();
      });
    });

    render();
  </script>
</body>
</html>
